name: Gecontroleerde website publiceren
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-site.yml'
      - '.github/workflows/goat-gemini.yml'
      - '.github/workflows/update-races.yml'
      - '_development/assets/goat-ai.js'
      - '_development/templates/goat.html.txt'
      - 'assets/goat-ai-config.js'
      - 'src/f1_analysis/goat_ai.py'
      - 'src/f1_analysis/goat_release.py'
      - 'workers/goat-ai-request/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: f1-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Publicatiegereedschap installeren
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Gecontroleerde website uit Releases herstellen
        run: |
          mkdir -p .site/config
          cp config/publication.yaml .site/config/publication.yaml
          python -m f1_analysis.github_storage --root .site load --compact
      - name: GOAT-pagina en automatische Gemini-aanvraag bijwerken
        run: |
          mkdir -p .site/_development/assets .site/_development/templates .site/assets
          cp _development/assets/goat-ai.js .site/_development/assets/goat-ai.js
          cp _development/templates/goat.html.txt .site/_development/templates/goat.html.txt
          cp assets/goat-ai-config.js .site/assets/goat-ai-config.js
          PYTHONPATH=src python -c "from f1_analysis.goat_release import promote; promote('.site')"
          python -m f1_analysis.publication verify --site .site
          rm -rf .site/storage .site/config
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v4

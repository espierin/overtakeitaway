<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overtake It Away · Data</title><script src="reader.js"></script><style>html{color-scheme:dark;background:#080b12;color:#f4f6fa;font:15px system-ui}body{margin:24px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #51d6dd;padding-bottom:16px}h1{font-size:20px;margin:0;overflow-wrap:anywhere}a{border:1px solid #51d6dd;border-top:3px solid #51d6dd;color:inherit;padding:8px 12px;text-decoration:none;border-radius:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace}p{color:#aeb9c8}</style></head><body><header><h1>Data</h1><a id="download">Download</a></header><p id="status" role="status"></p><pre id="content"></pre><script>
(async()=>{const name=new URLSearchParams(location.hash.slice(1)).get('path'),english=(()=>{try{return localStorage.getItem('overtake-it-away-language')==='en';}catch{return false;}})();document.documentElement.lang=english?'en':'nl';const status=document.getElementById('status');try{const entries=await overtakeData.routes();if(!name||!entries[name])throw Error(english?'Data file not found':'Databestand niet gevonden');document.querySelector('h1').textContent=name.split('/').pop();const r=await overtakeData.read(new URL(name,overtakeData.base));if(!r.ok)throw Error('HTTP '+r.status);const bytes=await r.arrayBuffer(),hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(b=>b.toString(16).padStart(2,'0')).join('');if(hash!==entries[name].sha256)throw Error(english?'Data verification failed':'Datacontrole mislukt');const blob=new Blob([bytes],{type:name.endsWith('.json')?'application/json':'text/csv'}),url=URL.createObjectURL(blob),a=document.getElementById('download');a.href=url;a.download=name.split('/').pop();a.textContent=english?'Download original file':'Origineel bestand downloaden';status.textContent=english?'Losslessly decompressed · integrity verified':'Verliesloos uitgepakt · inhoud gecontroleerd';const text=new TextDecoder().decode(bytes);document.getElementById('content').textContent=name.endsWith('.json')?JSON.stringify(JSON.parse(text),null,2):text;window.addEventListener('pagehide',()=>URL.revokeObjectURL(url),{once:true});}catch(e){status.textContent=e.message;}})();
</script></body></html>
